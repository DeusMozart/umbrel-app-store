version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: mozart-ups-monitor_peanut_1
      APP_PORT: 8080

  # Network UPS Tools server — talks to the USB-connected UPS.
  nut:
    image: instantlinux/nut-upsd:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev
    environment:
      - DRIVER=usbhid-ups
      - NAME=cyberpower
      - DESCRIPTION=CyberPower VP1200ELCD
      # CyberPower models need a MAXAGE longer than the default
      - MAXAGE=25
      - API_PASSWORD=${APP_SEED}

  # PeaNUT — small web dashboard for NUT.
  peanut:
    image: brandawg93/peanut:latest
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ${APP_DATA_DIR}/data/peanut:/config
    environment:
      - WEB_PORT=8080
      - AUTH_DISABLED=true
    depends_on:
      - nut
