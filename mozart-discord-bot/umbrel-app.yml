releaseNotes: >-
  1.7.0 — non-reasoning by default: replies skip the model's hidden thinking tokens (faster, cheaper), with a Reasoning switch in the dashboard if you want the thinking back. 1.6.0 — long-term memory: the bot gets its own Mnemosyne brain, one per server and fully local. It remembers every conversation, recalls what's relevant when it replies or chimes in, consolidates old memories into episode summaries over time, and is browsable/searchable/pausable from the dashboard or /brain. 1.5.0 — replies to the bot's messages now always trigger a response, and chime-in was made livelier (joins more often, still leashed by cooldowns). 1.4.0 — /summary: a quick public TL;DR of the recent chat, posted for everyone. 1.3.0 — soul.md: a personality file the bot lives by, editable live from the dashboard, with per-server personas layered on top. 1.2.0 — settings dashboard: live model picker with connection test, quiet hours, per-server editing. 1.1.0 — /memory + per-server personas. 1.0.0 — first release.
