id: mozart-discord-bot
category: ai
name: Discord Bot
version: "1.7.0"
tagline: A community bot that summarizes chats — and chimes in on its own
description: >-
  Lets a Discord bot live in your server with a memory of the conversation.

  • /summarize — a crisp brief of any channel's recent messages.
  • /summary — a one-breath TL;DR of the recent chat, posted for everyone.
  • /catchup — exactly what happened since you last spoke.
  • /chime — the bot joins the conversation on its own now and then: short, personable, on a leash (per-channel cooldown, daily caps, optional quiet hours).
  • /persona — shape its voice (per server).
  • /memory — teach it facts about your community; it weaves them into its replies.
  • /brain — its own long-term memory (Mnemosyne): it remembers every conversation per server, consolidates old memories into episode summaries over time, recalls what's relevant when it replies, and can be paused or browsed from the dashboard.
  • Dashboard — pick the model (live list + connection test) and reasoning on/off, set quiet hours, tune each channel, persona and memory, no restart needed.
  • soul.md — the bot's personality lives in a file you can edit right in the dashboard; every chime-in and reply follows it.

  Works with any OpenAI-compatible LLM endpoint, so you can point it at OpenCode Zen, OpenAI, OpenRouter or anything else that speaks the same API. Add your Discord bot token and LLM API key under Settings → Advanced → environment variables.
