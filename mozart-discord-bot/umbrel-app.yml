releaseNotes: >-
  1.1.0 — /memory (teach the bot facts about your community), per-server personas (/persona set|show|reset), OpenCode Go/Zen session-affinity fix, and command-group registration fix. 1.0.0 — first release: live summaries (/summarize, /catchup), ambient chime-in with moods and cooldowns, settable persona, and a status dashboard on port 8095.
