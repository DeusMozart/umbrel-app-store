name: Build Discord Bot image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mozart-discord-bot/bot/**"
      - ".github/workflows/build-discord-bot.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout store repo
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mozart-discord-bot/bot
          file: mozart-discord-bot/bot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/deusmozart/mozart-discord-bot:1.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
