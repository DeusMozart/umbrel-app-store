name: Build OpenDots image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mozart-opendots/docker/**"
      - ".github/workflows/build-opendots.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout store repo
        uses: actions/checkout@v4
      - name: Checkout OpenDots (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: CopilotKit/OpenDots
          ref: c2569bb6a13a22e565cf3eb791c62267d06babb1
          path: src
      - name: Prepare build context
        run: |
          cp -r mozart-opendots/docker src/.opendots-docker
          echo ".git" > src/.dockerignore
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/.opendots-docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/deusmozart/mozart-opendots:1.0.5
          cache-from: type=gha
          cache-to: type=gha,mode=max
